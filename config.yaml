server:
  host: 0.0.0.0
  port: 8080

database:
  path: ./data/nmonitor.db

scheduler:
  worker_count: 20
  scan_interval: 1s
  queue_size: 200

monitor:
  default_timeout: 5s
  default_interval: 60s

history:
  check_retention_days: 7
  event_retention_days: 365
  metric_retention_days: 90
  hour_metric_retention_days: 730

security:
  username: admin

log:
  level: info

backup:
  enabled: true
  dir: ./data/backups
  retention_days: 7
  hour: 3

# 检测失败后发信。密码不要写进文件，用环境变量 NMONITOR_SMTP_PASSWORD。
mail:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: ""
  to: ""
  encryption: starttls

# 管理台里的交互式终端，身份与 NMonitor 进程相同。
# Linux 使用 bash 或 sh；Windows 10 1809 及以上使用 PowerShell 或 cmd。
shell:
  enabled: true
  idle_timeout: 15m
  max_lifetime: 4h
  max_sessions: 8

# 管理台里的系统服务。通过本机 systemctl 启动、停止，并用 journalctl 查看日志。
# 身份与 NMonitor 进程相同。没有 systemd 时页面会提示不可用。
service:
  enabled: true
